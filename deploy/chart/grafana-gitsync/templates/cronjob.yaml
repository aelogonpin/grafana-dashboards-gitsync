{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "gitsync.name" . }}
  labels:
    {{- include "gitsync.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.job.backoffLimit }}
      template:
        spec:
          restartPolicy: Never
          containers:
            {{- include "gitsync.container" (dict "root" . "env" (list (dict "name" "TENANTS_FILE" "value" "/work/tenants.json"))) | nindent 12 }}
          volumes:
            {{- include "gitsync.volumes" . | nindent 12 }}
{{- end }}
