# Job de Git Sync para Kubernetes. Uso: kubectl apply -k deploy/  (o una app de ArgoCD apuntando aquí)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana

resources:
  - gitsync/job.yaml

configMapGenerator:
  - name: grafana-gitsync
    files:
      - tenants.json
      - gitsync/gitsync-sync.sh

generatorOptions:
  disableNameSuffixHash: true
