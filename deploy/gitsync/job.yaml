# Crea las conexiones de Git Sync que falten tras cada sync de ArgoCD.
# El Secret grafana-gitsync se crea aparte (ver secret.example.yaml), cifrado fuera de este repo.
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-gitsync
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: false
      containers:
        - name: gitsync
          image: alpine:3.20
          command: ["/bin/sh", "-c", "apk add --no-cache -q curl jq && sh /work/gitsync-sync.sh"]
          env:
            - name: GRAFANA_URL
              value: http://grafana.grafana.svc:80   # dummy: ajustar al Service real
            - name: TENANTS_FILE
              value: /work/tenants.json
            - name: SYNC_TARGET
              value: folder
            - name: GRAFANA_USER
              valueFrom: { secretKeyRef: { name: grafana-gitsync, key: grafana-user } }
            - name: GRAFANA_PASSWORD
              valueFrom: { secretKeyRef: { name: grafana-gitsync, key: grafana-password } }
            - name: GITHUB_TOKEN
              valueFrom: { secretKeyRef: { name: grafana-gitsync, key: github-token } }
          volumeMounts:
            - { name: work, mountPath: /work, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: work
          configMap: { name: grafana-gitsync }
