# Mide el host (node-exporter), a sí mismo y a Mimir, y escribe en un tenant de Mimir por cliente.
# Cada tenant recibe la etiqueta cliente=<nombre> para ver en los paneles de quién es el dato.
global:
  scrape_interval: 15s
scrape_configs:
  - job_name: node
    static_configs: [ { targets: ["node-exporter:9100"] } ]
  - job_name: prometheus
    static_configs: [ { targets: ["localhost:9090"] } ]
  - job_name: mimir
    static_configs: [ { targets: ["mimir:9009"] } ]
remote_write:
  - url: http://mimir:9009/api/v1/push
    headers: { X-Scope-OrgID: cliente-a }
    write_relabel_configs: [ { target_label: cliente, replacement: cliente-a } ]
  - url: http://mimir:9009/api/v1/push
    headers: { X-Scope-OrgID: cliente-b }
    write_relabel_configs: [ { target_label: cliente, replacement: cliente-b } ]
  - url: http://mimir:9009/api/v1/push
    headers: { X-Scope-OrgID: cliente-c }
    write_relabel_configs: [ { target_label: cliente, replacement: cliente-c } ]
